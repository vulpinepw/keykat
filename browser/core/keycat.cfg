
try {
  const { classes: Cc, interfaces: Ci, manager: Cm } = Components;
  const dir = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties)
    .get("GreD", Ci.nsIFile);
  dir.append("keycat");
  const manifest = dir.clone();
  manifest.append("chrome.manifest");
  if (manifest.exists()) {
    Cm.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    ChromeUtils.importESModule("resource://keycat/modules/KeycatBoot.sys.mjs").KeycatBoot.init();
  }
} catch (ex) {
  try {
    Components.utils.reportError(ex);
  } catch (e) {
    try {
      console.error("Keycat failed to start", ex);
    } catch (e2) {}
  }
}
